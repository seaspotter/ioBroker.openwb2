<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7CC142"/>
      <stop offset="100%" stop-color="#3E8E2F"/>
    </linearGradient>
  </defs>

  <!-- Badge -->
  <rect x="8" y="8" width="304" height="304" rx="64" fill="url(#bg)"/>
  <rect x="8" y="8" width="304" height="304" rx="64" fill="none" stroke="#2C5E22" stroke-width="4" opacity="0.35"/>

  <!-- Flowing cable, drawn first so the plug sits on top of its start -->
  <path d="M 118 108
           C 150 108, 150 150, 182 158
           C 214 166, 214 208, 176 222
           C 152 231, 150 248, 168 258"
        fill="none" stroke="#FFFFFF" stroke-width="15" stroke-linecap="round"/>

  <!-- Small spark at the cable's end -->
  <path d="M 176 244 L 162 268 L 172 268 L 164 286 L 186 260 L 174 260 Z" fill="#FFFFFF"/>

  <!-- Plug head -->
  <g>
    <rect x="78" y="82" width="66" height="56" rx="16" fill="#FFFFFF"/>
    <rect x="92" y="58" width="12" height="28" rx="6" fill="#FFFFFF"/>
    <rect x="118" y="58" width="12" height="28" rx="6" fill="#FFFFFF"/>
  </g>
</svg>
