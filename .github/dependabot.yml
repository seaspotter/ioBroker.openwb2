# Dependabot configuration
# Reference: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
    - package-ecosystem: 'github-actions'
      directory: '/'
      schedule:
          interval: 'weekly'

    - package-ecosystem: 'npm'
      directory: '/'
      schedule:
          interval: 'weekly'
      versioning-strategy: 'increase'
      ignore:
          - dependency-name: 'typescript'
            update-types:
                - 'version-update:semver-minor'
                - 'version-update:semver-major'
          - dependency-name: '@types/node'
            update-types:
                - 'version-update:semver-major'
          # @iobroker/adapter-react-v5 pins these as hard peer dependencies (react@^18.3.1,
          # react-dom@^18.3.1, @mui/material@^6.5.0, @mui/icons-material@^6.5.0), even in its
          # latest published version - a major bump here fails npm install with ERESOLVE until
          # that package itself updates its peer deps.
          - dependency-name: 'react'
            update-types:
                - 'version-update:semver-major'
          - dependency-name: 'react-dom'
            update-types:
                - 'version-update:semver-major'
          - dependency-name: '@types/react'
            update-types:
                - 'version-update:semver-major'
          - dependency-name: '@types/react-dom'
            update-types:
                - 'version-update:semver-major'
          - dependency-name: '@mui/material'
            update-types:
                - 'version-update:semver-major'
          - dependency-name: '@mui/icons-material'
            update-types:
                - 'version-update:semver-major'
